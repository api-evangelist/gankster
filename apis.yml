aid: gankster
name: Gankster
description: 'Gankster is a consumer competitive-gaming social platform — a web and mobile
  "looking for group" (LFG) network that helps players team up, practice, and compete across
  titles including Valorant, League of Legends, Dota 2, Counter-Strike 2, Rocket League,
  Fortnite, and World of Warcraft. It matches players by rank, playstyle, and reputation
  to find duos, five-stacks, and fill players, and lets teams organize scrims, tournaments,
  and recruitment. Gankster operates entirely outside the game client (no overlays or client
  modifications) and ships the Gankster Duos mobile app on iOS and Android. The company is
  backed by Bessemer Venture Partners and raised $4.25M for its all-in-one competitive gaming
  platform. Gankster does not currently publish a public developer API, SDKs, or API
  documentation.'
